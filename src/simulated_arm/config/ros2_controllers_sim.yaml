# Ignition Gazebo 仿真用控制器配置
# 由 xacro 中 ign_ros2_control 插件的 <parameters> 标签加载（controller_manager 运行在 Gazebo 进程内）
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - arm_joint1
      - arm_joint2
      - arm_joint3
      - arm_joint4
      - arm_joint5
      - arm_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # 位置指令直写 Gazebo 关节（理想位置执行），开环即可稳定
    open_loop_control: true
    allow_partial_joints_goal: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      arm_joint1:
        trajectory: 0.05
        goal: 0.03
      arm_joint2:
        trajectory: 0.05
        goal: 0.03
      arm_joint3:
        trajectory: 0.05
        goal: 0.03
      arm_joint4:
        trajectory: 0.05
        goal: 0.03
      arm_joint5:
        trajectory: 0.05
        goal: 0.03
      arm_joint6:
        trajectory: 0.05
        goal: 0.03
