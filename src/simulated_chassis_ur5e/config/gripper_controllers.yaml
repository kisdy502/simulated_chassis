controller_manager:
  ros__parameters:
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
gripper_controller:
  ros__parameters:
    joints: [ur5e_gripper_left_joint, ur5e_gripper_right_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 30.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 2.0
      ur5e_gripper_left_joint: {trajectory: 0.01, goal: 0.002}
      ur5e_gripper_right_joint: {trajectory: 0.01, goal: 0.002}
