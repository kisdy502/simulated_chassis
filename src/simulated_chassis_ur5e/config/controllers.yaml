# Merged with simulated_chassis/param/three_wheel_controllers.yaml at launch.
# Keep all chassis tuning in its original file.
controller_manager:
  ros__parameters:
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
joint_trajectory_controller:
  ros__parameters:
    joints: [ur5e_shoulder_pan_joint, ur5e_shoulder_lift_joint, ur5e_elbow_joint, ur5e_wrist_1_joint, ur5e_wrist_2_joint, ur5e_wrist_3_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 2.0
