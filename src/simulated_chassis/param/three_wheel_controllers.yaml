controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    three_wheel_base_controller:
      type: three_wheel_controller/ThreeWheelSteeringController

joint_state_broadcaster:
  ros__parameters:
    {}

three_wheel_base_controller:
  ros__parameters:
    # 轮位配置（与URDF一致）
    wheel0.x: 0.3
    wheel0.y: 0.0
    wheel0.max_steering_angle: 1.5708  # 90°

    wheel1.x: -0.15
    wheel1.y: 0.20
    wheel1.max_steering_angle: 1.5708

    wheel2.x: -0.15
    wheel2.y: -0.20
    wheel2.max_steering_angle: 1.5708

    # 运动学参数
    wheel_radius: 0.1
    max_linear_velocity: 1.5      # m/s
    max_angular_velocity: 1.0     # rad/s
    # 与 URDF 驱动轮关节的 velocity="10.0" 上限保持一致，避免各轮被单独截断。
    max_wheel_speed: 10.0         # rad/s (=1.0 m/s / 0.1 m)

    # 控制参数
    cmd_timeout: 0.5             # s
    debug_log_period: 0.0        # s，控制器调试日志周期（0=关闭，含门开关/反向切换事件日志）；排障时改 0.5
    enable_reverse_optimization: true
    steering_hold_velocity_threshold: 0.01  # m/s，低速时保持当前舵角
    alignment_full_speed_angle: 0.174533     # 10°，所有舵轮进入此误差后才允许驱动
    creep_wheel_speed: 0.5                   # rad/s，舵轮未对齐期间的蠕动轮速（滚动中舵轮才能克服地面摩擦转向；0=完全停车，会死锁）
    reverse_switch_hysteresis: 0.0872665     # 5°，防止正反转在临界点抖动
    publish_tf: false
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
