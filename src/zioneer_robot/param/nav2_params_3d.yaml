velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # 差速底盘：无侧向速度 (vy=0)
    max_velocity: [ 1.0, 0.0, 1.0 ]
    min_velocity: [ -0.35, 0.0, -1.0 ]
    max_accel: [ 2.0, 0.0, 2.0 ]
    min_accel: [ -2.0, 0.0, -2.0 ]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [ 0.0, 0.0, 0.0 ]
    velocity_timeout: 1.0
