services:
  robot-simulation:
    image: simulated-robot:wheel-3d
    build:
      context: .
      dockerfile: docker/simulated-robot/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      DISPLAY: ${DISPLAY:-:0}
      ROBOT_TYPE: ${ROBOT_TYPE:-omni_3wd}
      MODE: simulation
      USE_SIM_TIME: ${USE_SIM_TIME:-true}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      CYCLONEDDS_URI: file:///etc/cyclonedds.xml
      GAZEBO_GUI: ${GAZEBO_GUI:-false}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - simulation_data:/root/.ignition
      - ./runtime/simulation/ros:/root/.ros
      - ./docker/cyclonedds.xml:/etc/cyclonedds.xml:ro
    networks:
      agv_network:
        ipv4_address: 172.28.0.10

  agv-bridge:
    image: agv-bridge:wheel-3d
    build:
      context: .
      dockerfile: docker/agv-bridge/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    environment:
      DISPLAY: ${DISPLAY:-:0}
      AGV_ID: ${AGV_ID:-AGV001}
      USE_SIM_TIME: ${USE_SIM_TIME:-true}
      BACK_UP_MAX_HEADING_ERROR_DEG: ${BACK_UP_MAX_HEADING_ERROR_DEG:-20.0}
      WEBSOCKET_PORT: ${WEBSOCKET_PORT:-9090}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      CYCLONEDDS_URI: file:///etc/cyclonedds.xml
      ROBOT_PACKAGE: ${ROBOT_PACKAGE:-simulated_chassis}
      MANAGE_NAVIGATION: ${MANAGE_NAVIGATION:-true}
      MAPS_DIR: /ros2_ws/maps
      PBSTREAM_FILE: ${PBSTREAM_FILE:-}
      START_RVIZ: ${START_RVIZ:-false}
      AGV_PROCESS_LOG_DIR: /ros2_ws/process_logs
    volumes:
      - ./maps:/ros2_ws/maps
      - ./runtime/bridge/ros:/root/.ros
      - ./runtime/bridge/process:/ros2_ws/process_logs
      - ./docker/cyclonedds.xml:/etc/cyclonedds.xml:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    ports:
      - "${WEBSOCKET_PORT:-9090}:${WEBSOCKET_PORT:-9090}"
    depends_on:
      robot-simulation:
        condition: service_started
    networks:
      agv_network:
        ipv4_address: 172.28.0.11

networks:
  agv_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
volumes:
  simulation_data:
