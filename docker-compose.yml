services:
  # ==================== ROS2 机器人仿真 ====================
  
  robot-simulation:
    image: simulated-robot:latest
    build:
      context: .
      dockerfile: docker/simulated-robot/Dockerfile
    container_name: robot_simulation
    restart: unless-stopped
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - ROBOT_TYPE=${ROBOT_TYPE:-omni_3wd}
      - MODE=${MODE:-simulation}
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - simulation_data:/root/.gazebo
      - ./maps:/ros2_ws/maps
    networks:
      - agv_network
    ipc: host

  # ==================== AGV Bridge节点 ====================
  
  agv-bridge:
    image: agv-bridge:latest
    build:
      context: .
      dockerfile: docker/agv-bridge/Dockerfile
    container_name: agv_bridge
    restart: unless-stopped
    environment:
      - AGV_ID=${AGV_ID:-AGV001}
      - USE_SIM_TIME=${USE_SIM_TIME:-true}
      # 倒车朝向偏差阈值（度）：倒车绝不自动旋转，超阈值直接失败
      - BACK_UP_MAX_HEADING_ERROR_DEG=${BACK_UP_MAX_HEADING_ERROR_DEG:-20.0}
      - MAPS_DIR=/ros2_ws/maps
      - PBSTREAM_FILE=${PBSTREAM_FILE:-/ros2_ws/maps/my_map/my_map.pbstream}
      - ROBOT_PACKAGE=simulated_chassis
      - WEBSOCKET_PORT=${WEBSOCKET_PORT:-9090}
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      # 地图目录：/agv/get_map、/agv/list_maps 读取；切图重启定位（预留）
      - ./maps:/ros2_ws/maps
    ports:
      # rosbridge 的 JSON over WebSocket 端口，上位机从这里接入
      - "${WEBSOCKET_PORT:-9090}:${WEBSOCKET_PORT:-9090}"
    depends_on:
      robot-simulation:
        condition: service_started
      nav2-server:
        condition: service_started
    networks:
      - agv_network
    ipc: host
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==================== 导航 ====================
  
  nav2-server:
    image: simulated-robot:latest
    container_name: nav2_server
    restart: unless-stopped
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - ROBOT_TYPE=${ROBOT_TYPE:-omni_3wd}
      - MODE=navigation
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # Nav2 本身不启动定位（include_localization=false），保留该值仅供日志/手工切换。
      - PBSTREAM_FILE=${PBSTREAM_FILE:-/ros2_ws/maps/my_map/my_map.pbstream}
      - START_RVIZ=${START_RVIZ:-false}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./maps:/ros2_ws/maps
      - simulation_data:/root/.gazebo
    depends_on:
      robot-simulation:
        condition: service_started
    networks:
      - agv_network
    ipc: host

# ==================== 网络配置 ====================
networks:
  agv_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ==================== 数据卷 ====================
volumes:
  simulation_data:
    driver: local
